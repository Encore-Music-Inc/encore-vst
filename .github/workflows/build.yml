# Builds the ENCORE. plugins and runs the offline DSP tests on every platform:
# Windows x64, macOS (universal arm64 + x86_64), Linux x64 and Linux arm64
# (the arm64 runner stands in for 64-bit Raspberry Pi OS). The built plugin
# bundles are uploaded as one zip per platform. Nothing is signed yet.
name: Build

# Private repo: Actions minutes are limited (Mac minutes count 10x), so builds run only
# for a release tag or by hand (gh workflow run build.yml --ref <branch>).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTS: PitchTests PresetTests VerbTests EqTests MasterTests StrumTests
  # <folder under plugins/>:<CMake target>
  PLUGINS: Vox:Vox Verb:Verb EQ:SnsEQ Master:Master Strum:Strum

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: |
          for t in $TESTS; do
            echo "== $t"
            "build/${t}_artefacts/Release/$t.exe"
          done

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/VST3
          for p in $PLUGINS; do
            dir="${p%%:*}"; target="${p##*:}"
            cp -R "build/plugins/$dir/${target}_artefacts/Release/VST3/"*.vst3 dist/VST3/
          done
          cd dist && 7z a -tzip ../ENCORE-plugins-windows-x64.zip . > /dev/null

      - uses: actions/upload-artifact@v5
        with:
          name: ENCORE-plugins-windows-x64
          path: ENCORE-plugins-windows-x64.zip

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Tools
        run: command -v ninja || brew install ninja

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          for t in $TESTS; do
            echo "== $t"
            "build/${t}_artefacts/Release/$t"
          done

      - name: Check universal binaries
        run: |
          for p in $PLUGINS; do
            dir="${p%%:*}"; target="${p##*:}"
            for b in build/plugins/$dir/${target}_artefacts/Release/VST3/*.vst3/Contents/MacOS/* \
                     build/plugins/$dir/${target}_artefacts/Release/AU/*.component/Contents/MacOS/*; do
              lipo -info "$b"
              lipo "$b" -verify_arch arm64 x86_64
            done
          done

      - name: Validate AUs (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          for p in $PLUGINS; do
            dir="${p%%:*}"; target="${p##*:}"
            cp -R build/plugins/$dir/${target}_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          done
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep SnSd || true
          for code in SsVx SsVb SsEq SsMs SsSt; do
            echo "== auval aufx $code SnSd"
            if ! auval -strict -v aufx $code SnSd > auval-$code.log 2>&1; then
              tail -80 auval-$code.log
              exit 1
            fi
            tail -3 auval-$code.log
          done

      - name: Package
        run: |
          mkdir -p dist/VST3 dist/AU
          for p in $PLUGINS; do
            dir="${p%%:*}"; target="${p##*:}"
            cp -R build/plugins/$dir/${target}_artefacts/Release/VST3/*.vst3 dist/VST3/
            cp -R build/plugins/$dir/${target}_artefacts/Release/AU/*.component dist/AU/
          done
          cd dist && ditto -c -k . ../ENCORE-plugins-macos-universal.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ENCORE-plugins-macos-universal
          path: ENCORE-plugins-macos-universal.zip

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth zip \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # StrumTests opens the plugin's editor, so it needs an X display
      - name: Test
        run: |
          for t in $TESTS; do
            echo "== $t"
            xvfb-run -a "build/${t}_artefacts/Release/$t"
          done

      - name: Package
        run: |
          mkdir -p dist/VST3 dist/LV2
          for p in $PLUGINS; do
            dir="${p%%:*}"; target="${p##*:}"
            cp -R build/plugins/$dir/${target}_artefacts/Release/VST3/*.vst3 dist/VST3/
            cp -R build/plugins/$dir/${target}_artefacts/Release/LV2/*.lv2 dist/LV2/
          done
          cd dist && zip -qry ../ENCORE-plugins-linux-${{ matrix.arch }}.zip .

      - uses: actions/upload-artifact@v5
        with:
          name: ENCORE-plugins-linux-${{ matrix.arch }}
          path: ENCORE-plugins-linux-${{ matrix.arch }}.zip
